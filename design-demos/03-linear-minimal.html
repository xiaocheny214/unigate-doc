<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGate 快速开始 · Linear / Editorial Minimal</title>

  <!-- Standard React + Babel (no integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Clean Editorial Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          },
          colors: {
            linear: {
              bg: '#08090a',
              surface: '#0f1011',
              card: '#141517',
              border: '#1e2023',
              borderLight: '#2c2e33',
              subtle: '#62666d',
              muted: '#8a8f98',
              text: '#d0d6e0',
              heading: '#f7f8f8',
              accent: '#5e6ad2',
              accentLight: '#717ce0'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #08090a;
      color: #d0d6e0;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    pre, code, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Precise 1px hairline borders */
    .hairline-border {
      border: 1px solid #1e2023;
    }
    .hairline-b {
      border-bottom: 1px solid #1e2023;
    }
    .hairline-r {
      border-right: 1px solid #1e2023;
    }
    .hairline-t {
      border-top: 1px solid #1e2023;
    }
    /* Code syntax styling */
    .kw { color: #f28b82; }
    .str { color: #81c995; }
    .fn { color: #8ab4f8; }
    .com { color: #5f6368; font-style: italic; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#5e6ad2]/30 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const availableModels = [
      { id: 'gemini-3.8-flash', alias: 'flash-3.8', speed: 'ultra-fast', tag: 'recommended', context: '1M tokens', desc: '低延迟推理首选' },
      { id: 'claude-sonnet-4-6', alias: 'sonnet-4.6', speed: 'fast', tag: 'agent-ready', context: '200k tokens', desc: '代码与工具调用' },
      { id: 'claude-opus-4-6', alias: 'opus-4.6', speed: 'standard', tag: 'complex-tasks', context: '200k tokens', desc: '长篇分析与顶尖推理' },
      { id: 'gemini-3.1-pro', alias: 'pro-3.1', speed: 'fast', tag: 'enterprise', context: '2M tokens', desc: '通用大规模模型' },
    ];

    function CopyAction({ content, label = "COPY" }) {
      const [copied, setCopied] = useState(false);

      const doCopy = () => {
        navigator.clipboard.writeText(content);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      return (
        <button
          onClick={doCopy}
          type="button"
          className="font-mono text-[11px] tracking-wider text-linear-subtle hover:text-linear-heading transition-colors px-2 py-0.5 rounded border border-transparent hover:border-linear-border"
        >
          {copied ? <span className="text-emerald-400">COPIED</span> : label}
        </button>
      );
    }

    function LinearHeader() {
      return (
        <header className="hairline-b bg-linear-bg/90 backdrop-blur-sm sticky top-0 z-30">
          <div className="max-w-6xl mx-auto px-6 h-12 flex items-center justify-between text-xs font-mono">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2 text-linear-heading font-medium tracking-tight">
                <span className="w-2 h-2 rounded-full bg-linear-accent"></span>
                <span>unigate</span>
                <span className="text-linear-subtle">/</span>
                <span className="text-linear-muted">quickstart</span>
              </div>
              <div className="hidden sm:flex items-center gap-4 text-linear-subtle">
                <span className="text-linear-text">DOCS</span>
                <span className="hover:text-linear-text cursor-pointer">MODELS</span>
                <span className="hover:text-linear-text cursor-pointer">STATUS</span>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-linear-subtle hidden sm:inline">v1.2.0</span>
              <a
                href="https://unigate.top/keys"
                target="_blank"
                className="text-linear-text hover:text-white px-2.5 py-1 hairline-border rounded hover:border-linear-borderLight transition-colors"
              >
                API KEYS &rarr;
              </a>
            </div>
          </div>
        </header>
      );
    }

    function App() {
      const [chosenModel, setChosenModel] = useState('gemini-3.8-flash');
      const [activeTab, setActiveTab] = useState('curl');
      const [showSecret, setShowSecret] = useState(false);

      const curlText = `curl https://unigate.top/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -H "Authorization: Bearer YOUR_API_KEY" \\
  -d '{
    "model": "${chosenModel}",
    "messages": [
      {"role": "system", "content": "You are a helpful assistant."},
      {"role": "user", "content": "Hello!"}
    ],
    "stream": false
  }'`;

      const pythonText = `from openai import OpenAI

client = OpenAI(
    base_url="https://unigate.top/v1",
    api_key="YOUR_API_KEY"
)

response = client.chat.completions.create(
    model="${chosenModel}",
    messages=[
        {"role": "system", "content": "You are a helpful assistant."},
        {"role": "user", "content": "Hello!"}
    ],
    stream=False
)

print(response.choices[0].message.content)`;

      const nodeText = `import OpenAI from "openai";

const openai = new OpenAI({
  baseURL: "https://unigate.top/v1",
  apiKey: "YOUR_API_KEY"
});

const completion = await openai.chat.completions.create({
  model: "${chosenModel}",
  messages: [
    { role: "system", content: "You are a helpful assistant." },
    { role: "user", content: "Hello!" }
  ]
});

console.log(completion.choices[0].message.content);`;

      const codeSnippets = {
        curl: curlText,
        python: pythonText,
        node: nodeText
      };

      return (
        <div className="min-h-screen flex flex-col bg-linear-bg">
          <LinearHeader />

          <main className="max-w-5xl mx-auto px-6 py-12 flex-1 w-full space-y-12">

            {/* Title Section */}
            <div className="space-y-2 pb-6 hairline-b">
              <div className="font-mono text-[11px] uppercase tracking-widest text-linear-accent font-semibold">
                Developer Integration Guide
              </div>
              <h1 className="text-2xl sm:text-3xl font-semibold text-linear-heading tracking-tight font-sans">
                Quickstart
              </h1>
              <p className="text-sm text-linear-muted max-w-2xl font-normal leading-relaxed">
                Connect OpenAI and Anthropic compatible tools to UniGate with drop-in configuration. No proprietary SDKs required.
              </p>
            </div>

            {/* 1. Protocol Parameters (Editorial Monospace Table / Grid) */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-mono">
                <span className="text-linear-heading font-medium tracking-tight uppercase">[01] Gateway Endpoints</span>
                <span className="text-linear-subtle">HTTPS / TLS 1.3</span>
              </div>

              <div className="hairline-border rounded bg-linear-surface overflow-hidden">
                {/* Row: Base URL */}
                <div className="grid grid-cols-1 md:grid-cols-12 hairline-b text-xs font-mono">
                  <div className="p-3 md:col-span-3 text-linear-subtle bg-linear-bg/50 hairline-r flex items-center">
                    BASE_URL
                  </div>
                  <div className="p-3 md:col-span-7 text-linear-heading flex items-center">
                    <span>https://unigate.top/v1</span>
                    <span className="ml-2 text-[10px] text-linear-subtle px-1.5 py-0.2 hairline-border rounded">Universal</span>
                  </div>
                  <div className="p-3 md:col-span-2 flex items-center justify-end">
                    <CopyAction content="https://unigate.top/v1" />
                  </div>
                </div>

                {/* Row: API Key */}
                <div className="grid grid-cols-1 md:grid-cols-12 hairline-b text-xs font-mono">
                  <div className="p-3 md:col-span-3 text-linear-subtle bg-linear-bg/50 hairline-r flex items-center">
                    API_KEY
                  </div>
                  <div className="p-3 md:col-span-7 text-linear-text flex items-center gap-2">
                    <span>{showSecret ? 'sk-unigate-d819fa2e01b3' : 'sk-unigate-••••••••••••••••'}</span>
                    <button
                      onClick={() => setShowSecret(!showSecret)}
                      className="text-[10px] text-linear-subtle hover:text-linear-text underline"
                    >
                      {showSecret ? 'hide' : 'reveal'}
                    </button>
                  </div>
                  <div className="p-3 md:col-span-2 flex items-center justify-end">
                    <a
                      href="https://unigate.top/keys"
                      target="_blank"
                      className="font-mono text-[11px] text-linear-accent hover:text-linear-accentLight"
                    >
                      GET_KEY &rarr;
                    </a>
                  </div>
                </div>

                {/* Row: Models */}
                <div className="grid grid-cols-1 md:grid-cols-12 text-xs font-mono">
                  <div className="p-3 md:col-span-3 text-linear-subtle bg-linear-bg/50 hairline-r flex items-start pt-4">
                    ACTIVE_MODELS
                  </div>
                  <div className="p-3 md:col-span-9 space-y-2">
                    <div className="text-[11px] text-linear-subtle pb-1">Select a model to auto-populate runtime code snippets:</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {availableModels.map((m) => {
                        const isCurrent = chosenModel === m.id;
                        return (
                          <div
                            key={m.id}
                            onClick={() => setChosenModel(m.id)}
                            className={`p-2.5 rounded cursor-pointer transition-all ${
                              isCurrent
                                ? 'bg-linear-card hairline-border border-linear-accent'
                                : 'hairline-border hover:border-linear-borderLight bg-linear-bg/30'
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`text-xs font-mono font-medium ${isCurrent ? 'text-linear-heading' : 'text-linear-text'}`}>
                                {m.id}
                              </span>
                              {isCurrent && (
                                <span className="w-1.5 h-1.5 rounded-full bg-linear-accent"></span>
                              )}
                            </div>
                            <div className="flex items-center justify-between text-[10px] text-linear-subtle mt-1 font-mono">
                              <span>{m.desc}</span>
                              <span>{m.context}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* 2. Agent Env Injection (Linear Terminal Card) */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-mono">
                <span className="text-linear-heading font-medium tracking-tight uppercase">[02] Agent Configuration (Claude Code)</span>
                <span className="text-linear-subtle">CLI ENV INJECTION</span>
              </div>

              <div className="hairline-border rounded bg-linear-surface p-4 space-y-3 font-mono text-xs">
                <div className="text-linear-muted text-xs font-sans">
                  Export standard Anthropic environment variables to hook Claude Code or terminal agents directly to UniGate:
                </div>

                <div className="bg-linear-bg p-3.5 rounded hairline-border space-y-1.5 relative group">
                  <div className="absolute top-2.5 right-3">
                    <CopyAction
                      content={`export ANTHROPIC_BASE_URL="https://unigate.top/v1"\nexport ANTHROPIC_AUTH_TOKEN="sk-unigate-YOUR_KEY"`}
                      label="COPY EXPORTS"
                    />
                  </div>
                  <div className="text-linear-subtle text-[11px] mb-2">// Terminal session / bashrc / zshrc</div>
                  <div>
                    <span className="text-purple-400">export</span> <span className="text-linear-text">ANTHROPIC_BASE_URL</span>=<span className="text-emerald-400">"https://unigate.top/v1"</span>
                  </div>
                  <div>
                    <span className="text-purple-400">export</span> <span className="text-linear-text">ANTHROPIC_AUTH_TOKEN</span>=<span className="text-emerald-400">"sk-unigate-xxxxxxxx"</span>
                  </div>
                </div>

                <div className="text-[11px] text-linear-subtle flex items-center justify-between pt-1">
                  <span>Note: Tokens are encrypted in transit over TLS 1.3</span>
                  <span className="text-linear-muted">Agent CLI compatibility: 100%</span>
                </div>
              </div>
            </div>

            {/* 3. API Execution (Editorial Code Block) */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-mono">
                <span className="text-linear-heading font-medium tracking-tight uppercase">[03] Chat Completions API</span>
                <div className="flex items-center gap-1">
                  {['curl', 'python', 'node'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setActiveTab(tab)}
                      className={`px-2 py-0.5 rounded text-[11px] font-mono transition-colors ${
                        activeTab === tab
                          ? 'text-linear-heading bg-linear-card hairline-border'
                          : 'text-linear-subtle hover:text-linear-text'
                      }`}
                    >
                      {tab.toUpperCase()}
                    </button>
                  ))}
                </div>
              </div>

              <div className="hairline-border rounded bg-linear-surface overflow-hidden">
                <div className="p-4 bg-linear-bg text-xs font-mono leading-relaxed overflow-x-auto relative">
                  <div className="absolute top-3 right-4">
                    <CopyAction content={codeSnippets[activeTab]} label="COPY CODE" />
                  </div>
                  <pre className="text-linear-text">
                    {codeSnippets[activeTab]}
                  </pre>
                </div>
                <div className="px-4 py-2 hairline-t bg-linear-surface flex items-center justify-between text-[11px] font-mono text-linear-subtle">
                  <span>Target: POST /v1/chat/completions</span>
                  <span>Model: {chosenModel}</span>
                </div>
              </div>
            </div>

            {/* Next Step Reference */}
            <div className="p-4 rounded hairline-border bg-linear-surface/50 flex flex-col sm:flex-row sm:items-center justify-between text-xs font-mono text-linear-subtle gap-3">
              <div>
                <span className="text-linear-text font-medium">Ready for production?</span> Explore full parameter schemas and streaming docs.
              </div>
              <a href="#" className="text-linear-accent hover:text-linear-accentLight whitespace-nowrap">
                API Reference &rarr;
              </a>
            </div>

          </main>

          <footer className="hairline-t py-6 text-center text-xs font-mono text-linear-subtle">
            UniGate API Engine · Editorial Monospace Specification
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
