<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGate 快速开始 · Vercel / Developer Tool Pattern</title>

  <!-- Standard React + Babel (no integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Geist / Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Geist Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          },
          colors: {
            vercel: {
              black: '#000000',
              bg: '#0a0a0a',
              card: '#111111',
              cardHover: '#161616',
              border: '#222222',
              borderHover: '#333333',
              subtle: '#888888',
              foreground: '#ededed',
              accent: '#0070f3',
              cyan: '#50e3c2',
              purple: '#7928ca'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #000000;
      color: #ededed;
      font-family: 'Geist', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    pre, code {
      font-family: 'Geist Mono', monospace;
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(80, 227, 194, 0.15);
    }
    .glow-blue {
      box-shadow: 0 0 35px -5px rgba(0, 112, 243, 0.2);
    }
    .glow-card:hover {
      box-shadow: 0 0 30px -10px rgba(255, 255, 255, 0.08);
    }
    .grid-bg {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="selection:bg-white selection:text-black min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const modelsData = [
      { id: 'gemini-3.8-flash', title: 'Gemini 3.8 Flash', tag: 'Fast / Recommended', badge: 'Default', latency: '~180ms', desc: '超轻量高并发测试首选' },
      { id: 'claude-sonnet-4-6', title: 'Claude Sonnet 4.6', tag: 'Agent / Code', badge: 'Balanced', latency: '~420ms', desc: '最佳编程与复杂工具调度' },
      { id: 'claude-opus-4-6', title: 'Claude Opus 4.6', tag: 'High-Reasoning', badge: 'Flagship', latency: '~850ms', desc: '高难度长文本与复杂推理' },
      { id: 'gemini-3.1-pro', title: 'Gemini 3.1 Pro', tag: 'Enterprise', badge: 'All-Rounder', latency: '~350ms', desc: '通用大规模企业级调用' },
    ];

    function CopyBtn({ text, label = "Copy" }) {
      const [copied, setCopied] = useState(false);

      const copyHandler = () => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <button
          onClick={copyHandler}
          type="button"
          className={`flex items-center gap-1.5 px-2.5 py-1 text-xs font-mono rounded-md border transition-all duration-200 ${
            copied
              ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-400'
              : 'border-white/10 hover:border-white/20 bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white'
          }`}
        >
          {copied ? (
            <>
              <svg className="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
              </svg>
              <span>COPIED</span>
            </>
          ) : (
            <>
              <svg className="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <span>{label}</span>
            </>
          )}
        </button>
      );
    }

    function VercelNavbar() {
      return (
        <nav className="border-b border-white/10 bg-black/80 backdrop-blur-xl sticky top-0 z-50">
          <div className="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <div className="flex items-center gap-6">
              <a href="#" className="flex items-center gap-2 text-white font-semibold tracking-tight text-sm">
                <div className="w-6 h-6 bg-white rounded-md flex items-center justify-center text-black font-black text-xs">
                  ▲
                </div>
                <span>UniGate</span>
                <span className="text-zinc-600">/</span>
                <span className="text-zinc-400 font-normal">Docs</span>
              </a>
              <div className="hidden md:flex items-center gap-5 text-xs text-zinc-400">
                <a href="#" className="text-white">Quickstart</a>
                <a href="#" className="hover:text-white transition-colors">Endpoints</a>
                <a href="#" className="hover:text-white transition-colors">Models</a>
                <a href="#" className="hover:text-white transition-colors">Playground</a>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <a
                href="https://unigate.top/keys"
                target="_blank"
                rel="noreferrer"
                className="px-3 py-1.5 text-xs font-medium rounded-full bg-white text-black hover:bg-zinc-200 transition-colors flex items-center gap-1.5"
              >
                <span>Generate Key</span>
                <span>&rarr;</span>
              </a>
            </div>
          </div>
        </nav>
      );
    }

    function App() {
      const [curModel, setCurModel] = useState('gemini-3.8-flash');
      const [curTab, setCurTab] = useState('bash');
      const [maskedKey, setMaskedKey] = useState(true);

      const curlSnippet = `curl https://unigate.top/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -H "Authorization: Bearer YOUR_API_KEY" \\
  -d '{
    "model": "${curModel}",
    "messages": [
      {"role": "system", "content": "You are a helpful assistant."},
      {"role": "user", "content": "Hello!"}
    ],
    "stream": false
  }'`;

      const pythonSnippet = `from openai import OpenAI

client = OpenAI(
    base_url="https://unigate.top/v1",
    api_key="YOUR_API_KEY"
)

response = client.chat.completions.create(
    model="${curModel}",
    messages=[
        {"role": "system", "content": "You are a helpful assistant."},
        {"role": "user", "content": "Hello!"}
    ],
    stream=False
)

print(response.choices[0].message.content)`;

      const nodeSnippet = `import OpenAI from "openai";

const openai = new OpenAI({
  baseURL: "https://unigate.top/v1",
  apiKey: "YOUR_API_KEY"
});

const completion = await openai.chat.completions.create({
  model: "${curModel}",
  messages: [
    { role: "system", content: "You are a helpful assistant." },
    { role: "user", content: "Hello!" }
  ]
});

console.log(completion.choices[0].message.content);`;

      const codeMap = {
        bash: curlSnippet,
        python: pythonSnippet,
        node: nodeSnippet
      };

      return (
        <div className="min-h-screen flex flex-col bg-black">
          <VercelNavbar />

          {/* Hero Banner with Grid Pattern */}
          <div className="relative border-b border-white/10 grid-bg py-16 px-6 overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-b from-transparent via-black/80 to-black pointer-events-none"></div>

            <div className="max-w-4xl mx-auto relative z-10 text-center">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-mono text-zinc-400 mb-6 glow-cyan">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Gateway Status: Operational · Zero-Config Proxy</span>
              </div>

              <h1 className="text-4xl sm:text-5xl font-bold tracking-tight text-white mb-4">
                Quickstart with <span className="bg-gradient-to-r from-white via-zinc-200 to-zinc-500 bg-clip-text text-transparent">UniGate API</span>
              </h1>
              <p className="text-zinc-400 text-base sm:text-lg max-w-2xl mx-auto font-light leading-relaxed">
                Connect your OpenAI and Anthropic SDKs seamlessly. Switch base endpoints with zero code refactoring and deploy AI agents instantly.
              </p>
            </div>
          </div>

          {/* Main Layout */}
          <main className="max-w-5xl mx-auto px-6 py-12 space-y-12 flex-1 w-full">

            {/* Section 1: Endpoints & Config Grid Cards */}
            <section className="space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-semibold tracking-tight text-white flex items-center gap-2">
                    <span className="text-zinc-500 font-mono text-xs">01 //</span>
                    Gateway Parameters
                  </h2>
                  <p className="text-xs text-zinc-500 mt-0.5">Universal endpoint for OpenAI & Anthropic SDK compatibility</p>
                </div>
                <a
                  href="https://unigate.top/keys"
                  target="_blank"
                  className="text-xs font-mono text-sky-400 hover:text-sky-300 transition-colors flex items-center gap-1"
                >
                  Manage API Keys &rarr;
                </a>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Base URL Card */}
                <div className="p-5 rounded-xl border border-white/10 bg-[#0c0c0c] glow-card transition-all relative group">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-sky-400"></span>
                      <span className="text-xs font-mono uppercase text-zinc-400 tracking-wider">Base URL</span>
                    </div>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">Universal Entry</span>
                  </div>

                  <div className="bg-black border border-white/10 rounded-lg p-3 font-mono text-sm text-zinc-200 flex items-center justify-between">
                    <span>https://unigate.top/v1</span>
                    <CopyBtn text="https://unigate.top/v1" label="Copy" />
                  </div>

                  <p className="text-xs text-zinc-500 mt-3 font-mono">
                    OpenAI: <span className="text-zinc-400">base_url</span> · Anthropic: <span className="text-zinc-400">ANTHROPIC_BASE_URL</span>
                  </p>
                </div>

                {/* API Key Card */}
                <div className="p-5 rounded-xl border border-white/10 bg-[#0c0c0c] glow-card transition-all">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                      <span className="text-xs font-mono uppercase text-zinc-400 tracking-wider">Authentication</span>
                    </div>
                    <button
                      onClick={() => setMaskedKey(!maskedKey)}
                      className="text-[11px] text-zinc-500 hover:text-zinc-300 font-mono transition-colors"
                    >
                      [{maskedKey ? 'Reveal' : 'Mask'}]
                    </button>
                  </div>

                  <div className="bg-black border border-white/10 rounded-lg p-3 font-mono text-sm text-zinc-300 flex items-center justify-between">
                    <span>{maskedKey ? "sk-unigate-••••••••••••••••" : "sk-unigate-a1b2c3d4e5f6"}</span>
                    <a
                      href="https://unigate.top/keys"
                      target="_blank"
                      className="text-xs px-2.5 py-1 rounded bg-white text-black font-semibold hover:bg-zinc-200 transition-colors"
                    >
                      Get Key
                    </a>
                  </div>

                  <p className="text-xs text-zinc-500 mt-3 font-mono">
                    Bearer Token format · Generate from <a href="https://unigate.top/keys" target="_blank" className="underline text-zinc-400">unigate.top/keys</a>
                  </p>
                </div>
              </div>

              {/* Models Selector Grid */}
              <div className="p-5 rounded-xl border border-white/10 bg-[#0c0c0c] space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono uppercase text-zinc-400 tracking-wider">Supported Models</span>
                    <span className="text-[11px] text-zinc-600 font-mono">Select to insert into code template</span>
                  </div>
                  <span className="text-xs text-zinc-400 font-mono">4 Models Available</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  {modelsData.map((m) => {
                    const isSelected = curModel === m.id;
                    return (
                      <button
                        key={m.id}
                        onClick={() => setCurModel(m.id)}
                        type="button"
                        className={`text-left p-3.5 rounded-lg border transition-all duration-150 ${
                          isSelected
                            ? 'border-white bg-white/10 glow-blue ring-1 ring-white/30'
                            : 'border-white/10 bg-black/60 hover:border-white/25 hover:bg-white/[0.03]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-xs font-mono font-semibold text-white">{m.id}</span>
                          <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${
                            isSelected ? 'bg-white text-black font-bold' : 'bg-white/10 text-zinc-400'
                          }`}>
                            {m.badge}
                          </span>
                        </div>
                        <div className="text-[11px] text-zinc-400 font-sans">{m.desc}</div>
                        <div className="mt-2 text-[10px] font-mono text-zinc-500 flex items-center justify-between border-t border-white/5 pt-1.5">
                          <span>Latency: {m.latency}</span>
                          <span className="text-emerald-400 font-medium">99.9%</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* Section 2: Agent Integration Terminal */}
            <section className="space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-semibold tracking-tight text-white flex items-center gap-2">
                    <span className="text-zinc-500 font-mono text-xs">02 //</span>
                    Agent Tool Integration (Claude Code)
                  </h2>
                  <p className="text-xs text-zinc-500 mt-0.5">Inject UniGate gateway credentials to drive terminal agents directly</p>
                </div>
                <span className="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded">
                  Zero Code Required
                </span>
              </div>

              <div className="rounded-xl border border-white/10 bg-[#080808] overflow-hidden">
                <div className="px-4 py-2.5 border-b border-white/10 bg-black flex items-center justify-between">
                  <div className="flex items-center gap-2 text-xs font-mono text-zinc-400">
                    <div className="flex items-center gap-1.5 mr-2">
                      <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                      <div className="w-3 h-3 rounded-full bg-amber-500/80"></div>
                      <div className="w-3 h-3 rounded-full bg-emerald-500/80"></div>
                    </div>
                    <span>terminal ~ env-inject.sh</span>
                  </div>
                  <CopyBtn
                    text={`export ANTHROPIC_BASE_URL="https://unigate.top/v1"\nexport ANTHROPIC_AUTH_TOKEN="sk-unigate-YOUR_API_KEY"`}
                    label="Copy Script"
                  />
                </div>

                <div className="p-5 font-mono text-xs space-y-3 leading-relaxed text-zinc-300">
                  <div className="text-zinc-500"># 1. 在终端直接注入 Anthropic 兼容端点</div>
                  <div className="flex items-center gap-2 bg-white/[0.02] p-2.5 rounded border border-white/5">
                    <span className="text-sky-400 font-bold">$</span>
                    <span className="text-purple-400">export</span>
                    <span className="text-zinc-200">ANTHROPIC_BASE_URL=</span>
                    <span className="text-emerald-300">"https://unigate.top/v1"</span>
                  </div>

                  <div className="text-zinc-500"># 2. 设置 UniGate API Key 作为认证令牌</div>
                  <div className="flex items-center gap-2 bg-white/[0.02] p-2.5 rounded border border-white/5">
                    <span className="text-sky-400 font-bold">$</span>
                    <span className="text-purple-400">export</span>
                    <span className="text-zinc-200">ANTHROPIC_AUTH_TOKEN=</span>
                    <span className="text-emerald-300">"sk-unigate-your-key-here"</span>
                  </div>

                  <div className="text-zinc-500"># 3. 启动 Claude Code</div>
                  <div className="flex items-center gap-2 text-zinc-300">
                    <span className="text-sky-400 font-bold">$</span>
                    <span className="text-white font-semibold">claude</span>
                    <span className="text-zinc-600">// Connected to unigate.top</span>
                  </div>
                </div>

                <div className="p-3 bg-zinc-950 border-t border-white/5 text-[11px] text-zinc-500 flex items-center justify-between">
                  <span>Supported Agents: Claude Code · Cursor · OpenCode · Cline · Continue</span>
                  <span className="font-mono text-zinc-400">Ready in 5s</span>
                </div>
              </div>
            </section>

            {/* Section 3: Interactive Code Snippets */}
            <section className="space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-semibold tracking-tight text-white flex items-center gap-2">
                    <span className="text-zinc-500 font-mono text-xs">03 //</span>
                    Chat Completions API Execution
                  </h2>
                  <p className="text-xs text-zinc-500 mt-0.5">Test API calls with your selected model: <span className="font-mono text-zinc-300">{curModel}</span></p>
                </div>
              </div>

              {/* Polished Code Window */}
              <div className="rounded-xl border border-white/10 bg-[#0a0a0a] overflow-hidden shadow-2xl">
                {/* Tabs bar */}
                <div className="border-b border-white/10 bg-black/60 px-4 py-2 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    {[
                      { id: 'bash', label: 'cURL' },
                      { id: 'python', label: 'Python (SDK)' },
                      { id: 'node', label: 'Node.js (SDK)' }
                    ].map((tab) => (
                      <button
                        key={tab.id}
                        onClick={() => setCurTab(tab.id)}
                        type="button"
                        className={`px-3 py-1 text-xs font-mono rounded-md transition-all ${
                          curTab === tab.id
                            ? 'bg-white text-black font-semibold'
                            : 'text-zinc-400 hover:text-white hover:bg-white/5'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  <CopyBtn text={codeMap[curTab]} label="Copy Code" />
                </div>

                {/* Code body */}
                <div className="p-5 overflow-x-auto text-xs font-mono leading-relaxed bg-[#050505]">
                  <pre className="text-zinc-200">
                    {codeMap[curTab]}
                  </pre>
                </div>

                {/* Footer status bar */}
                <div className="px-4 py-2.5 bg-black border-t border-white/10 flex items-center justify-between text-xs font-mono text-zinc-500">
                  <div className="flex items-center gap-3">
                    <span className="flex items-center gap-1.5 text-zinc-400">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      Ready to execute
                    </span>
                    <span>stream: false</span>
                  </div>
                  <span className="text-zinc-600">OpenAI Spec 1.0</span>
                </div>
              </div>
            </section>

          </main>

          <footer className="border-t border-white/10 py-8 px-6 bg-black text-center text-xs font-mono text-zinc-600">
            UniGate Developer Documentation Platform · Engineered for Developers
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
