<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGate 快速开始 · Stripe Docs Pattern</title>

  <!-- Standard React + Babel (no integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Fira Code', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            stripe: {
              navy: '#0a2540',
              text: '#3c4257',
              muted: '#697386',
              border: '#e3e8ee',
              card: '#ffffff',
              bg: '#f8fafc',
              accent: '#635bff',
              accentHover: '#0a2540',
              success: '#00d924',
              badgeBg: '#f0f3f9'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: #3c4257;
      background-color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    pre, code {
      font-family: 'Fira Code', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const modelsList = [
      { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash', tag: '推荐测试', provider: 'Google', desc: '超高吞吐、极低延迟，最适合高频交互与测试' },
      { id: 'claude-sonnet-4-6', name: 'Claude Sonnet 4.6', tag: '主力代码', provider: 'Anthropic', desc: '强大的编程、架构与工具调用能力' },
      { id: 'claude-opus-4-6', name: 'Claude Opus 4.6', tag: '深度推理', provider: 'Anthropic', desc: '复杂逻辑解构与长上下文终极理解' },
      { id: 'gemini-3.1-pro', name: 'Gemini 3.1 Pro', tag: '通用生产', provider: 'Google', desc: '兼顾成本与全能推理的旗舰选择' }
    ];

    function CopyButton({ text, label = "复制", className = "" }) {
      const [copied, setCopied] = useState(false);

      const handleCopy = () => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      return (
        <button
          onClick={handleCopy}
          type="button"
          className={`inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded transition-all duration-150 ${
            copied
              ? 'bg-emerald-50 text-emerald-700 border border-emerald-300'
              : 'bg-white text-slate-700 hover:text-slate-900 border border-slate-200 hover:border-slate-300 shadow-sm'
          } ${className}`}
          title="复制到剪贴板"
        >
          {copied ? (
            <>
              <svg className="w-3.5 h-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
              </svg>
              <span>已复制</span>
            </>
          ) : (
            <>
              <svg className="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <span>{label}</span>
            </>
          )}
        </button>
      );
    }

    function StripeNavbar() {
      return (
        <header className="sticky top-0 z-40 w-full bg-white border-b border-stripe-border/80 backdrop-blur-md">
          <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div className="flex items-center gap-6">
              <a href="#" className="flex items-center gap-2.5 font-bold text-lg text-stripe-navy tracking-tight">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white text-sm font-black shadow-sm">
                  UG
                </div>
                <span>UniGate <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">Docs</span></span>
              </a>
              <nav className="hidden md:flex items-center gap-5 text-sm font-medium text-slate-600">
                <a href="#" className="text-indigo-600 font-semibold">快速开始</a>
                <a href="#" className="hover:text-stripe-navy transition-colors">模型与定价</a>
                <a href="#" className="hover:text-stripe-navy transition-colors">Agent 接入</a>
                <a href="#" className="hover:text-stripe-navy transition-colors">API 参考</a>
              </nav>
            </div>
            <div className="flex items-center gap-3">
              <div className="hidden sm:flex items-center text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 gap-2">
                <span>网关状态</span>
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="font-mono text-emerald-700 font-medium">99.98%</span>
              </div>
              <a
                href="https://unigate.top/keys"
                target="_blank"
                rel="noreferrer"
                className="px-3.5 py-1.5 text-xs font-semibold rounded-lg text-white bg-stripe-navy hover:bg-slate-800 transition-colors shadow-sm"
              >
                控制台 / Keys
              </a>
            </div>
          </div>
        </header>
      );
    }

    function App() {
      const [selectedModel, setSelectedModel] = useState('gemini-3.8-flash');
      const [activeLang, setActiveLang] = useState('curl');
      const [showMaskedKey, setShowMaskedKey] = useState(true);
      const [viewOutput, setViewOutput] = useState(false);

      const snippetCurl = `curl https://unigate.top/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -H "Authorization: Bearer YOUR_API_KEY" \\
  -d '{
    "model": "${selectedModel}",
    "messages": [
      {"role": "system", "content": "You are a helpful assistant."},
      {"role": "user", "content": "Hello!"}
    ],
    "stream": false
  }'`;

      const snippetPython = `from openai import OpenAI

client = OpenAI(
    base_url="https://unigate.top/v1",
    api_key="YOUR_API_KEY"
)

response = client.chat.completions.create(
    model="${selectedModel}",
    messages=[
        {"role": "system", "content": "You are a helpful assistant."},
        {"role": "user", "content": "Hello!"}
    ],
    stream=False
)

print(response.choices[0].message.content)`;

      const snippetNode = `import OpenAI from "openai";

const openai = new OpenAI({
  baseURL: "https://unigate.top/v1",
  apiKey: "YOUR_API_KEY"
});

async function main() {
  const completion = await openai.chat.completions.create({
    messages: [
      { role: "system", content: "You are a helpful assistant." },
      { role: "user", content: "Hello!" }
    ],
    model: "${selectedModel}",
  });

  console.log(completion.choices[0].message.content);
}

main();`;

      const sampleResponse = `{
  "id": "chatcmpl-98a7cf2e94b21",
  "object": "chat.completion",
  "created": 1728312000,
  "model": "${selectedModel}",
  "choices": [
    {
      "index": 0,
      "message": {
        "role": "assistant",
        "content": "Hello! I am ready to assist you. How can I help you today?"
      },
      "finish_reason": "stop"
    }
  ],
  "usage": {
    "prompt_tokens": 19,
    "completion_tokens": 16,
    "total_tokens": 35
  }
}`;

      const activeCode = activeLang === 'curl' ? snippetCurl : activeLang === 'python' ? snippetPython : snippetNode;

      return (
        <div className="min-h-screen flex flex-col">
          <StripeNavbar />

          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-10">
            {/* Header intro */}
            <div className="mb-8 border-b border-stripe-border pb-6">
              <div className="flex items-center gap-2 text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-2">
                <span>入门指南</span>
                <span className="text-slate-300">/</span>
                <span>快速开始</span>
              </div>
              <h1 className="text-3xl font-bold text-stripe-navy tracking-tight">首次调用 API</h1>
              <p className="mt-2 text-base text-stripe-muted max-w-3xl leading-relaxed">
                UniGate API 严格兼容 OpenAI 与 Anthropic 官方协议。无需更换已有代码库的 SDK，只需将 Base URL 指向 UniGate，即可自由路由主流顶尖大模型。
              </p>
            </div>

            {/* Split layout: Narrative on left, Sticky Code on right */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

              {/* Left Column: Guides, Key-Value Cards, Env injection (7 cols) */}
              <div className="lg:col-span-7 space-y-8">

                {/* 1. Gateway Configuration Card */}
                <section>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-lg font-bold text-stripe-navy flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-xs flex items-center justify-center font-bold">1</span>
                      网关连接参数 (Configuration)
                    </h2>
                    <span className="text-xs text-slate-400 font-mono">OpenAI & Anthropic Compatible</span>
                  </div>

                  <div className="bg-white border border-stripe-border rounded-xl shadow-sm divide-y divide-slate-100 overflow-hidden">
                    {/* Property: Base URL */}
                    <div className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-semibold uppercase tracking-wider text-slate-500 font-mono">BASE_URL</span>
                          <span className="text-[11px] font-medium px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">全协议统一</span>
                        </div>
                        <div className="mt-1 font-mono text-sm font-semibold text-stripe-navy bg-slate-50 px-2.5 py-1 rounded border border-slate-200/70 inline-block">
                          https://unigate.top/v1
                        </div>
                        <p className="text-xs text-slate-500 mt-1">OpenAI 与 Anthropic 接口共用此入口</p>
                      </div>
                      <CopyButton text="https://unigate.top/v1" label="复制 URL" />
                    </div>

                    {/* Property: API Key */}
                    <div className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-semibold uppercase tracking-wider text-slate-500 font-mono">API_KEY</span>
                          <span className="text-[11px] font-medium px-2 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200">必须保密</span>
                        </div>
                        <div className="mt-1 flex items-center gap-2">
                          <code className="font-mono text-sm font-medium text-slate-700 bg-slate-50 px-2.5 py-1 rounded border border-slate-200/70">
                            {showMaskedKey ? "sk-unigate-••••••••••••••••" : "sk-unigate-d8f92a10b4c"}
                          </code>
                          <button
                            type="button"
                            onClick={() => setShowMaskedKey(!showMaskedKey)}
                            className="text-xs text-slate-400 hover:text-slate-600 font-medium"
                          >
                            {showMaskedKey ? "显示" : "隐藏"}
                          </button>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <a
                          href="https://unigate.top/keys"
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-1 px-3 py-1 text-xs font-semibold rounded bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 transition-colors"
                        >
                          <span>创建 API Key</span>
                          <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                          </svg>
                        </a>
                      </div>
                    </div>

                    {/* Property: Supported Models */}
                    <div className="p-4 sm:p-5">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-semibold uppercase tracking-wider text-slate-500 font-mono">SUPPORTED_MODELS</span>
                          <span className="text-xs text-slate-400">点击选中实时同步右侧代码</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
                        {modelsList.map((m) => {
                          const isSelected = selectedModel === m.id;
                          return (
                            <div
                              key={m.id}
                              onClick={() => setSelectedModel(m.id)}
                              className={`p-3 rounded-lg border cursor-pointer transition-all ${
                                isSelected
                                  ? 'border-indigo-600 bg-indigo-50/50 shadow-xs ring-1 ring-indigo-600'
                                  : 'border-slate-200 hover:border-slate-300 bg-white'
                              }`}
                            >
                              <div className="flex items-center justify-between">
                                <span className="font-mono text-xs font-bold text-stripe-navy">{m.id}</span>
                                <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${
                                  isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                                }`}>
                                  {m.tag}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-1 line-clamp-1">{m.desc}</p>
                            </div>
                          );
                        })}
                      </div>

                      <div className="mt-3 flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
                        <span>💡 推荐使用 <strong className="text-slate-700 font-mono">gemini-3.8-flash</strong> 作为测试基准模型</span>
                        <a href="#" className="text-indigo-600 hover:underline font-medium">查看完整费率与支持矩阵 &rarr;</a>
                      </div>
                    </div>
                  </div>
                </section>

                {/* 2. Agent Integration Section */}
                <section>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-lg font-bold text-stripe-navy flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-xs flex items-center justify-center font-bold">2</span>
                      接入 Agent 工具与命令行 (Claude Code)
                    </h2>
                    <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">无需改写代码</span>
                  </div>

                  <div className="bg-white border border-stripe-border rounded-xl p-5 shadow-sm space-y-4">
                    <p className="text-sm text-stripe-text leading-relaxed">
                      UniGate 已深度兼容 Claude Code、Cursor、GitHub Copilot 与各类智能 Agent。如果你在终端使用 <strong>Claude Code</strong>，仅需在启动前注入环境变量，即可直接路由：
                    </p>

                    <div className="bg-slate-900 rounded-lg p-4 font-mono text-xs text-slate-200 border border-slate-800 relative group">
                      <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-slate-400">
                        <span>~/.zshrc 或当前终端 Session</span>
                        <CopyButton
                          text={`export ANTHROPIC_BASE_URL="https://unigate.top/v1"\nexport ANTHROPIC_AUTH_TOKEN="sk-unigate-YOUR_KEY"`}
                          label="复制命令"
                          className="bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700"
                        />
                      </div>
                      <div className="space-y-1.5 text-slate-300">
                        <div>
                          <span className="text-emerald-400">export</span> ANTHROPIC_BASE_URL=<span className="text-amber-300">"https://unigate.top/v1"</span>
                        </div>
                        <div>
                          <span className="text-emerald-400">export</span> ANTHROPIC_AUTH_TOKEN=<span className="text-amber-300">"sk-unigate-xxxxxxxx"</span>
                        </div>
                        <div className="pt-2 text-slate-500 font-sans italic text-[11px]">
                          # 完成后直接执行 claude 即可开启编程伴侣
                        </div>
                      </div>
                    </div>

                    <div className="flex items-start gap-3 p-3.5 rounded-lg bg-amber-50/70 border border-amber-200/80 text-xs text-amber-900">
                      <svg className="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                      </svg>
                      <div>
                        <strong>安全合规规范：</strong>切勿将包含真实密钥的脚本提交至公开 GitHub 仓库。在本地生产项目中建议配合 <code>.env.local</code> 进行管理。
                      </div>
                    </div>
                  </div>
                </section>

                {/* 3. Steps summary */}
                <section className="bg-slate-50 border border-slate-200 rounded-xl p-5">
                  <h3 className="text-sm font-bold text-stripe-navy mb-3">下一步指引</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <a href="https://unigate.top/keys" target="_blank" className="p-3 bg-white border border-slate-200 rounded-lg hover:border-indigo-300 transition-colors block">
                      <div className="font-semibold text-stripe-navy">1. 获取凭证</div>
                      <div className="text-slate-500 mt-1">在控制台生成 sk- 开头的密钥</div>
                    </a>
                    <a href="#" className="p-3 bg-white border border-slate-200 rounded-lg hover:border-indigo-300 transition-colors block">
                      <div className="font-semibold text-stripe-navy">2. 测试调用</div>
                      <div className="text-slate-500 mt-1">复制右侧代码在本地运行验证</div>
                    </a>
                    <a href="#" className="p-3 bg-white border border-slate-200 rounded-lg hover:border-indigo-300 transition-colors block">
                      <div className="font-semibold text-stripe-navy">3. 开启流式</div>
                      <div className="text-slate-500 mt-1">设置 stream: true 获取打字机体验</div>
                    </a>
                  </div>
                </section>
              </div>

              {/* Right Column: Sticky Code Console (5 cols) */}
              <div className="lg:col-span-5 sticky top-20">
                <div className="bg-[#0f172a] rounded-xl shadow-xl border border-slate-800 overflow-hidden">

                  {/* Console Header with language switcher */}
                  <div className="bg-slate-900/90 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800/80">
                      {[
                        { id: 'curl', label: 'cURL' },
                        { id: 'python', label: 'Python' },
                        { id: 'node', label: 'Node.js' }
                      ].map((lang) => (
                        <button
                          key={lang.id}
                          onClick={() => { setActiveLang(lang.id); setViewOutput(false); }}
                          type="button"
                          className={`px-3 py-1 text-xs font-semibold rounded-md transition-all ${
                            activeLang === lang.id && !viewOutput
                              ? 'bg-indigo-600 text-white shadow-xs'
                              : 'text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          {lang.label}
                        </button>
                      ))}
                      <div className="w-[1px] h-3.5 bg-slate-700 mx-1"></div>
                      <button
                        onClick={() => setViewOutput(!viewOutput)}
                        type="button"
                        className={`px-2.5 py-1 text-xs font-medium rounded-md transition-all flex items-center gap-1 ${
                          viewOutput
                            ? 'bg-emerald-600 text-white'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span>响应预览</span>
                      </button>
                    </div>

                    <CopyButton
                      text={viewOutput ? sampleResponse : activeCode}
                      label="复制"
                      className="bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700 text-xs"
                    />
                  </div>

                  {/* Active Context Bar */}
                  <div className="px-4 py-2 bg-slate-950/60 border-b border-slate-800/50 flex items-center justify-between text-[11px] font-mono text-slate-400">
                    <div className="flex items-center gap-2">
                      <span className="text-slate-500">Target Model:</span>
                      <span className="text-indigo-400 font-semibold">{selectedModel}</span>
                    </div>
                    <div>
                      {viewOutput ? (
                        <span className="text-emerald-400">HTTP 200 OK</span>
                      ) : (
                        <span className="text-slate-500">POST /v1/chat/completions</span>
                      )}
                    </div>
                  </div>

                  {/* Code Area */}
                  <div className="p-4 overflow-x-auto custom-scrollbar max-h-[540px]">
                    {viewOutput ? (
                      <pre className="text-xs text-emerald-300 font-mono leading-relaxed selection:bg-indigo-900 selection:text-white">
                        {sampleResponse}
                      </pre>
                    ) : (
                      <pre className="text-xs text-slate-300 font-mono leading-relaxed selection:bg-indigo-900 selection:text-white">
                        {activeCode}
                      </pre>
                    )}
                  </div>

                  {/* Footer note inside terminal */}
