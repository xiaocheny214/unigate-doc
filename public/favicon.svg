<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Ultra Deep Space Void -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Monolith Body Gradient -->
    <linearGradient id="fav-monolith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243048"/>
      <stop offset="35%" stop-color="#151e32"/>
      <stop offset="70%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="fav-edge-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Spectrum Beams -->
    <linearGradient id="fav-b1" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-b2" x1="0%" y1="50%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-b3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-b4" x1="0%" y1="50%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-b5" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#fav-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Spectrum Beams -->
  <polygon points="256,256 470,126 480,150 256,256" fill="url(#fav-b1)" opacity="0.95"/>
  <polygon points="256,256 480,184 484,210 256,256" fill="url(#fav-b2)" opacity="0.95"/>
  <polygon points="256,256 484,246 484,272 256,256" fill="url(#fav-b3)" opacity="0.95"/>
  <polygon points="256,256 478,308 470,332 256,256" fill="url(#fav-b4)" opacity="0.95"/>
  <polygon points="256,256 452,364 436,386 256,256" fill="url(#fav-b5)" opacity="0.95"/>

  <!-- Incoming Laser -->
  <line x1="32" y1="256" x2="256" y2="256" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="256" x2="256" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Monolith Arch -->
  <path d="M 166 112 V 288 C 166 370, 216 404, 256 404 C 296 404, 346 370, 346 288 V 112 H 390 V 288 C 390 398, 314 446, 256 446 C 198 446, 122 398, 122 288 V 112 Z"
        fill="url(#fav-monolith)" stroke="#334155" stroke-width="3"/>
  <path d="M 166 112 V 288 C 166 370, 216 404, 256 404 C 296 404, 346 370, 346 288 V 112"
        fill="none" stroke="url(#fav-edge-cyan)" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Prism Core -->
  <polygon points="256,212 294,278 218,278" fill="#ffffff"/>
  <polygon points="256,222 286,274 226,274" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
